name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  swift-lint:
    name: Swift Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict

  plugin-test:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # pi plugin tests need >= 23.6 for built-in TypeScript type stripping
          node-version: "24"
      - name: Test opencode plugin
        run: npm --prefix plugins/opencode test
      - name: Test Stream Deck plugin
        run: npm --prefix plugins/streamdeck test
      - name: Test pi plugin
        run: node --test plugins/pi/test/*.test.mjs

  hook-contract:
    name: Hook Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install check-jsonschema
        run: |
          python3 -m venv .venv-contract
          . .venv-contract/bin/activate
          python -m pip install --upgrade pip
          python -m pip install check-jsonschema
          echo "$PWD/.venv-contract/bin" >> "$GITHUB_PATH"
      - name: Validate hook contract
        run: make contract

  swift-test:
    name: Swift Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: menubar/build/
          key: deriveddata-${{ runner.os }}-xcode16.3-${{ hashFiles('menubar/CctopMenubar.xcodeproj/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode16.3-
      - name: Build menubar app
        run: xcodebuild build -project menubar/CctopMenubar.xcodeproj -scheme CctopMenubar -configuration Debug -derivedDataPath menubar/build/ CODE_SIGN_IDENTITY="-"
      - name: Test Stream Deck version bump
        run: scripts/test-bump-streamdeck-version.sh
      - name: Test
        run: make swift-test
      - name: Smoke test cctop-hook
        run: |
          SMOKE_DIR=$(mktemp -d)
          echo '{"session_id":"ci-test","cwd":"/tmp/proj","hook_event_name":"SessionStart"}' \
            | CCTOP_SESSIONS_DIR="$SMOKE_DIR" menubar/build/Build/Products/Debug/cctop-hook SessionStart
          SESSION_FILE=$(ls "$SMOKE_DIR"/*.json | head -1)
          test -f "$SESSION_FILE"
          grep -q '"idle"' "$SESSION_FILE"
          grep -q '"ci-test"' "$SESSION_FILE"
          rm -rf "$SMOKE_DIR"
